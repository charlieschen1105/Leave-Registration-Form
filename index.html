<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>学生请假管理系统</title>
<style>
:root{
  --bg:#eef2f7; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --primary:#2563eb; --primary-soft:#eff6ff;
  --green:#059669; --green-soft:#ecfdf5;
  --amber:#d97706; --amber-soft:#fffbeb;
  --red:#dc2626; --red-soft:#fef2f2;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
.app{max-width:1180px;margin:0 auto;padding:14px 14px 60px}

/* 顶栏 */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:linear-gradient(135deg,#1d4ed8,#2563eb 55%,#3b82f6);
  color:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 8px 24px rgba(37,99,235,.25);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);
  display:grid;place-items:center;font-size:19px;font-weight:700;flex:0 0 auto;
  border:1px solid rgba(255,255,255,.25);
}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.brand p{margin:2px 0 0;font-size:12px;opacity:.85}
.sync-box{display:flex;align-items:center;gap:8px;font-size:12px;background:rgba(255,255,255,.14);
  padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);white-space:nowrap}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.25)}
.sync-dot.on{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.3)}
.sync-dot.err{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.3)}

/* 标签页 */
.tabs{display:flex;gap:6px;margin:14px 0;background:#fff;padding:6px;border-radius:12px;
  box-shadow:0 1px 3px rgba(15,23,42,.06);overflow-x:auto}
.tab{
  flex:1 0 auto;border:0;background:transparent;color:var(--muted);font-size:14px;
  padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap;transition:.18s;
}
.tab:hover{color:var(--primary);background:var(--primary-soft)}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(37,99,235,.3)}

/* 卡片 */
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;
  box-shadow:0 1px 3px rgba(15,23,42,.06);border:1px solid rgba(226,232,240,.8)}
.card h2{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--primary)}
.card h3{margin:22px 0 10px;font-size:14px;font-weight:700;color:#334155}
.desc{margin:-6px 0 14px;color:var(--muted);font-size:12.5px}

/* 表单 */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:#475569}
.req{color:var(--red)}
input,select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;
  background:#f8fafc;color:var(--text);font-family:inherit;transition:.16s;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);background:#fff;
  box-shadow:0 0 0 3px rgba(37,99,235,.12)}
textarea{resize:vertical;min-height:62px}
.hint{font-size:12px;color:var(--muted)}
.hint.ok{color:var(--green);font-weight:600}

.seg{display:flex;gap:6px}
.seg-btn{flex:1;border:1px solid var(--line);background:#f8fafc;color:#475569;padding:9px 6px;
  border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;font-family:inherit;transition:.16s}
.seg-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}

.form-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px}
.btn{
  border:0;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:.16s;white-space:nowrap;
}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(37,99,235,.28)}
.btn.primary:hover{background:#1d4ed8}
.btn.ghost{background:#f1f5f9;color:#334155;border:1px solid var(--line)}
.btn.ghost:hover{background:#e2e8f0}
.btn.danger{background:var(--red-soft);color:var(--red);border:1px solid #fecaca}
.btn.danger:hover{background:#fee2e2}
.btn.tiny{padding:6px 12px;font-size:12.5px;border-radius:8px}
.form-msg{font-size:13px;font-weight:600}
.form-msg.ok{color:var(--green)}
.form-msg.err{color:var(--red)}

.switch{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer;color:#334155;font-weight:600}
.switch input{width:auto;accent-color:var(--primary)}

/* 工具栏 */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{width:auto;min-width:130px;flex:1 1 130px}

/* 记录卡片 */
.records{display:flex;flex-direction:column;gap:10px}
.record{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#fff;transition:.16s}
.record:hover{border-color:#cbd5e1;box-shadow:0 3px 12px rgba(15,23,42,.07)}
.rec-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:7px}
.rec-name{font-weight:700;font-size:15px}
.rec-meta{font-size:12.5px;color:var(--muted)}
.rec-dur{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600}
.badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.out{background:var(--amber-soft);color:var(--amber)}
.badge.back{background:var(--green-soft);color:var(--green)}
.badge.wait{background:#f1f5f9;color:#64748b}
.rec-body{display:grid;gap:3px;font-size:13px;color:#334155}
.rec-body b{color:#64748b;font-weight:600}
.rec-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.rec-actions button{border:1px solid var(--line);background:#f8fafc;color:#475569;
  padding:5px 12px;border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:600}
.rec-actions button:hover{background:#eef2f7;color:var(--primary)}
.rec-actions button.del:hover{background:var(--red-soft);color:var(--red);border-color:#fecaca}

.empty{text-align:center;color:var(--muted);padding:38px 10px;font-size:13.5px}

/* 统计 */
.range-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.range-btn{border:1px solid var(--line);background:#f8fafc;color:#475569;padding:8px 16px;
  border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.16s}
.range-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.range-bar input[type=date]{width:auto;padding:7px 10px;font-size:13px}
.range-label{font-size:12.5px;color:var(--muted);margin-left:auto}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:8px}
.stat{background:linear-gradient(160deg,#f8fafc,#fff);border:1px solid var(--line);
  border-radius:12px;padding:13px 14px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:23px;font-weight:800;margin-top:3px;letter-spacing:-.5px}
.stat .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px}
.stat.blue .v{color:var(--primary)} .stat.red .v{color:var(--red)}
.stat.amber .v{color:var(--amber)} .stat.green .v{color:var(--green)}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f8fafc;color:#475569;font-weight:700;font-size:12.5px;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8fafc}
td.num,th.num{text-align:right}
tfoot td{font-weight:700;background:#f8fafc}

/* 提示 */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#0f172a;color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;
  transition:.28s;z-index:99;box-shadow:0 8px 22px rgba(15,23,42,.3)}
#toast.show{opacity:1;transform:translate(-50%,0)}

.panel{display:none}
.panel.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media(max-width:640px){
  .app{padding:10px 10px 50px}
  .topbar{padding:13px;border-radius:14px;flex-direction:column;align-items:stretch}
  .brand h1{font-size:15.5px}
  .sync-box{justify-content:center}
  .card{padding:14px}
  .grid{grid-template-columns:1fr}
  .stat .v{font-size:20px}
  .rec-dur{margin-left:0;width:100%}
}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo">假</div>
      <div>
        <h1>学生请假管理系统</h1>
        <p id="brandSub">加载中…</p>
      </div>
    </div>
    <div class="sync-box">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncText">本地模式</span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="form">📝 登记请假</button>
    <button class="tab" data-tab="records">📋 请假记录</button>
    <button class="tab" data-tab="summary">📊 汇总统计</button>
    <button class="tab" data-tab="settings">⚙️ 设置</button>
  </nav>

  <!-- ============ 登记请假 ============ -->
  <section class="panel active" id="panel-form">
    <div class="card">
      <h2 id="formTitle">新增请假登记</h2>
      <form id="leaveForm" autocomplete="off">
        <div class="grid">
          <div class="field">
            <label>学生 <span class="req">*</span></label>
            <input id="fStudent" list="studentDatalist" placeholder="输入姓名或学号后从下拉选择">
            <datalist id="studentDatalist"></datalist>
            <div class="hint" id="studentHint">未选择学生</div>
          </div>

          <div class="field">
            <label>请假类型</label>
            <div class="seg" id="typeSeg">
              <button type="button" class="seg-btn active" data-val="病假">病假</button>
              <button type="button" class="seg-btn" data-val="事假">事假</button>
              <button type="button" class="seg-btn" data-val="其他">其他</button>
            </div>
          </div>

          <div class="field full">
            <label>请假事由 <span class="req">*</span></label>
            <textarea id="fReason" placeholder="例如：发烧38.5℃，需前往医院就诊"></textarea>
          </div>

          <div class="field">
            <label>请假开始时间 <span class="req">*</span></label>
            <input type="datetime-local" id="fStart">
          </div>

          <div class="field">
            <label>预计返校时间</label>
            <input type="datetime-local" id="fEnd">
          </div>

          <div class="field">
            <label>来接的人</label>
            <input id="fPicker" placeholder="例如：徐某某">
          </div>

          <div class="field">
            <label>与学生关系</label>
            <select id="fRelation">
              <option value="">请选择</option>
              <option>父亲</option><option>母亲</option>
              <option>祖父</option><option>祖母</option>
              <option>外祖父</option><option>外祖母</option>
              <option>其他亲属</option><option>其他</option>
            </select>
          </div>

          <div class="field">
            <label>联系电话</label>
            <input id="fPhone" inputmode="tel" placeholder="例如：13800000000">
          </div>

          <div class="field">
            <label>当前状态</label>
            <select id="fStatus">
              <option>离校中</option>
              <option>待审批</option>
              <option>已返校</option>
            </select>
          </div>

          <div class="field full">
            <label>备注</label>
            <input id="fNote" placeholder="选填，如：家长已到校门口">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn primary" id="btnSubmit">提交登记</button>
          <button type="button" class="btn ghost" id="btnReset">清空表单</button>
          <span class="form-msg" id="formMsg"></span>
        </div>
      </form>
    </div>
  </section>

  <!-- ============ 请假记录 ============ -->
  <section class="panel" id="panel-records">
    <div class="card">
      <h2>请假记录</h2>
      <div class="toolbar">
        <input id="qSearch" placeholder="搜索姓名 / 事由 / 来接人">
        <select id="qStatus">
          <option value="">全部状态</option>
          <option>离校中</option><option>待审批</option><option>已返校</option>
        </select>
        <select id="qType">
          <option value="">全部类型</option>
          <option>病假</option><option>事假</option><option>其他</option>
        </select>
        <input type="date" id="qFrom" title="起始日期">
        <input type="date" id="qTo" title="结束日期">
        <button class="btn ghost tiny" id="btnExportCsv">导出CSV</button>
      </div>
      <div class="records" id="recordsList"></div>
    </div>
  </section>

  <!-- ============ 汇总统计 ============ -->
  <section class="panel" id="panel-summary">
    <div class="card">
      <h2>定期汇总</h2>
      <div class="range-bar">
        <button class="range-btn active" data-range="week">本周</button>
        <button class="range-btn" data-range="month">本月</button>
        <button class="range-btn" data-range="term">本学期</button>
        <button class="range-btn" data-range="all">全部</button>
        <input type="date" id="rFrom"><span style="color:#94a3b8">~</span><input type="date" id="rTo">
        <span class="range-label" id="rangeLabel"></span>
      </div>

      <div class="stats" id="statCards"></div>

      <h3>学生请假明细</h3>
      <div class="table-wrap"><table id="tblStudents"></table></div>

      <h3>按周汇总</h3>
      <div class="table-wrap"><table id="tblWeeks"></table></div>

      <h3>按月汇总</h3>
      <div class="table-wrap"><table id="tblMonths"></table></div>
    </div>
  </section>

  <!-- ============ 设置 ============ -->
  <section class="panel" id="panel-settings">
    <div class="card">
      <h2>基础设置</h2>
      <div class="grid">
        <div class="field">
          <label>班级名称</label>
          <input id="setClassName" placeholder="例如：三年级3班">
        </div>
        <div class="field">
          <label>学期开始日期</label>
          <input type="date" id="setTermStart">
        </div>
        <div class="field">
          <label>学期结束日期</label>
          <input type="date" id="setTermEnd">
        </div>
      </div>
    </div>

    <div class="card">
      <h2>云同步（跨设备实时共享）</h2>
      <p class="desc">
        本系统默认使用浏览器本地存储，<b>同一设备多窗口/多标签自动实时同步</b>。<br>
        若需<b>手机、平板、电脑跨设备共享</b>，可免费注册 <b>jsonbin.io</b>，创建一个 Bin，
        把 Bin ID 与 Master Key 填入下方，各设备填写相同配置即可自动同步。
      </p>
      <div class="grid">
        <div class="field">
          <label>Bin ID</label>
          <input id="setBinId" placeholder="例如：65f1a2b3c4d5e6f7a8b9c0d1">
        </div>
        <div class="field">
          <label>Master Key</label>
          <input id="setKey" type="password" placeholder="$2a$10$...">
        </div>
        <div class="field">
          <label>自动同步间隔（秒）</label>
          <input type="number" id="setInterval" min="5" max="600" value="15">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn primary" id="btnPushCloud">⬆ 上传到云端</button>
        <button class="btn ghost" id="btnPullCloud">⬇ 从云端拉取</button>
        <label class="switch"><input type="checkbox" id="setAuto"> 开启自动同步</label>
      </div>
      <div class="hint" id="cloudMsg" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <h2>数据管理</h2>
      <div class="form-actions">
        <button class="btn ghost" id="btnExportJson">导出 JSON 备份</button>
        <button class="btn ghost" id="btnImportJson">导入 JSON 备份</button>
        <input type="file" id="fileImport" accept=".json,application/json" hidden>
        <button class="btn danger" id="btnClearLeaves">清空全部请假记录</button>
      </div>
      <div class="hint" style="margin-top:10px">
        提示：建议每周导出一次 JSON 备份；导入会与现有数据按更新时间合并，不会覆盖更新的记录。
      </div>
    </div>
  </section>

</div>
<div id="toast"></div>

<script>
/* =========================================================
 *  1. 基础数据
 * =======================================================*/
const STORAGE_KEY  = 'student_leave_db_v1';
const SETTINGS_KEY = 'student_leave_settings_v1';
const CHANNEL_NAME = 'student_leave_sync_v1';

const DEFAULT_STUDENTS = [
  ['03','01','徐浩添','男'],['03','02','林雨纯','女'],['03','03','施金彤','女'],
  ['03','04','王华麟','男'],['03','05','朱宇航','男'],['03','06','张慕青','女'],
  ['03','07','张雪林','女'],['03','08','程莹','女'],['03','09','陈南屹','男'],
  ['03','10','杨紫蔓','女'],['03','11','黄功凯','男'],['03','12','李佳佳','女'],
  ['03','13','王晨蒙','女'],['03','14','叶智诚','男'],['03','15','石雅涵','女'],
  ['03','16','王梓翔','男'],['03','17','王皓月','女'],['03','18','赖思恺','男'],
  ['03','19','王子龙','男'],['03','20','包黔冉','女'],['03','21','谢泽洋','男'],
  ['03','22','周熙晨','女'],['03','23','陈浩楠','男'],['03','24','胡泽皓','男'],
  ['03','25','金栩如','女'],['03','26','蒋琴玉','女'],['03','27','胡俊驰','男'],
  ['03','28','童鑫','男'],['03','29','王诚裕','男'],['03','30','邵光宗','男'],
  ['03','31','施欣晨','女'],['03','32','唐静雅','女'],['03','33','徐承睿','男'],
  ['03','34','李可欣','女'],['03','35','邵思辰','女'],['03','36','王贤哲','男'],
  ['03','37','吴嘉豪','男'],['03','39','奚圣博','男'],['03','41','朱剑羽','男'],
  ['03','42','叶宇文','男']
].map(a => ({ cls: a[0], sid: a[1], name: a[2], gender: a[3] }));

/* =========================================================
 *  2. 工具函数
 * =======================================================*/
const $  = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function fmtDate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fmtDT(s){
  if(!s) return '—';
  const d = new Date(s);
  if(isNaN(d)) return '—';
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function toLocalInput(d){
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function mondayOf(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dow = (x.getDay() + 6) % 7;       // 周一 = 0
  x.setDate(x.getDate() - dow);
  return x;
}
function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const week = Math.ceil((((t - yearStart) / 86400000) + 1) / 7);
  return { year: t.getUTCFullYear(), week };
}
function durationText(min){
  if(min == null) return '—';
  if(min < 60) return min + ' 分钟';
  const h = Math.floor(min / 60), m = min % 60;
  if(h < 24) return m ? `${h}小时${m}分` : `${h}小时`;
  return `${Math.floor(h/24)}天${h%24}小时`;
}
function recMinutes(r){
  const s = new Date(r.start).getTime();
  let e;
  if(r.end) e = new Date(r.end).getTime();
  else if(r.status === '离校中') e = Date.now();
  else return null;
  if(!e || e <= s) return null;
  return Math.round((e - s) / 60000);
}
let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

}

/* =========================================================
 *  4. 实时同步（多窗口 / 跨设备）
 * =======================================================*/
let bc = null;
try{ bc = new BroadcastChannel(CHANNEL_NAME); }catch(e){ bc = null; }

function postSync(){
  try{ if(bc) bc.postMessage({ type: 'db-updated', ts: DB.updatedAt }); }catch(e){}
  if(SETTINGS.cloud.auto && SETTINGS.cloud.binId && SETTINGS.cloud.key){
    pushCloud(true);
  }
}
if(bc){
  bc.onmessage = e => {
    if(e.data && e.data.type === 'db-updated'){
      const fresh = loadDB();
      if(fresh.updatedAt !== DB.updatedAt){
        DB = fresh;
        renderAll();
        toast('数据已从其他窗口同步');
      }
    }
  };
}
window.addEventListener('storage', e => {
  if(e.key === STORAGE_KEY && e.newValue){
    try{
      const fresh = JSON.parse(e.newValue);
      if(fresh.updatedAt !== DB.updatedAt){
        DB = fresh;
        renderAll();
        toast('数据已同步');
      }
    }catch(err){}
  }
});
/* 兜底轮询（3 秒），保证不支持 BroadcastChannel 的环境也能同步 */
setInterval(() => {
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d.updatedAt && d.updatedAt !== DB.updatedAt){
      DB = d;
      renderAll();
    }
  }catch(e){}
}, 3000);

/* =========================================================
 *  5. 云同步（jsonbin.io）
 * =======================================================*/
function cloudReady(){
  return !!(SETTINGS.cloud.binId && SETTINGS.cloud.key);
}
function setSyncState(state, text){
  const dot = $('syncDot'), t = $('syncText');
  dot.className = 'sync-dot' + (state ? ' ' + state : '');
  t.textContent = text;
}
function updateSyncText(){
  if(cloudReady()){
    setSyncState('on', lastSyncAt ? `云端已同步 ${lastSyncAt}` : '云端模式');
  }else{
    setSyncState('', '本地模式（多窗口实时同步）');
  }
}
async function pushCloud(silent){
  if(!cloudReady()){
    if(!silent){ setCloudMsg('请先填写 Bin ID 与 Master Key', 'err'); }
    return false;
  }
  try{
    if(!silent) setCloudMsg('正在上传…');
    const res = await fetch(`https://api.jsonbin.io/v3/b/${SETTINGS.cloud.binId}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': SETTINGS.cloud.key
      },
      body: JSON.stringify({
        students: DB.students,
        leaves: DB.leaves,
        updatedAt: DB.updatedAt || Date.now()
      })
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    lastSyncAt = new Date().toLocaleTimeString('zh-CN', {hour12:false});
    updateSyncText();
    if(!silent){ setCloudMsg('✅ 上传成功 ' + lastSyncAt, 'ok'); toast('已上传到云端'); }
    return true;
  }catch(err){
    setSyncState('err', '云端同步失败');
    if(!silent) setCloudMsg('❌ 上传失败：' + err.message, 'err');
    return false;
  }
}
async function pullCloud(silent){
  if(!cloudReady()){
    if(!silent) setCloudMsg('请先填写 Bin ID 与 Master Key', 'err');
    return false;
  }
  try{
    if(!silent) setCloudMsg('正在拉取…');
    const res = await fetch(`https://api.jsonbin.io/v3/b/${SETTINGS.cloud.binId}/latest`, {
      headers: { 'X-Master-Key': SETTINGS.cloud.key }
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const remote = json.record || json;
    if(!remote || !Array.isArray(remote.leaves)) throw new Error('云端数据格式不正确');

    const merged = mergeDB(DB, remote);
    if(merged.updatedAt !== DB.updatedAt || merged.leaves.length !== DB.leaves.length){
      DB = merged;
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){}
      renderAll();
      if(!silent) toast('已从云端同步最新数据');
    }
    lastSyncAt = new Date().toLocaleTimeString('zh-CN', {hour12:false});
    updateSyncText();
    if(!silent) setCloudMsg('✅ 拉取成功 ' + lastSyncAt, 'ok');
    return true;
  }catch(err){
    setSyncState('err', '云端同步失败');
    if(!silent) setCloudMsg('❌ 拉取失败：' + err.message, 'err');
    return false;
  }
}
function mergeDB(local, remote){
  const map = new Map();
  (local.leaves || []).forEach(r => map.set(r.id, r));
  (remote.leaves || []).forEach(r => {
    const ex = map.get(r.id);
    if(!ex || (r.updatedAt || 0) > (ex.updatedAt || 0)) map.set(r.id, r);
  });
  const leaves = [...map.values()].sort((a,b) => new Date(a.start) - new Date(b.start));
  return {
    students: (remote.students && remote.students.length) ? remote.students : local.students,
    leaves,
    updatedAt: Math.max(local.updatedAt || 0, remote.updatedAt || 0, Date.now())
  };
}
function setCloudMsg(msg, cls){
  const el = $('cloudMsg');
  el.textContent = msg;
  el.className = 'hint' + (cls ? ' ' + cls : '');
}
function startAutoSync(){
  clearInterval(autoTimer);
  if(!SETTINGS.cloud.auto || !cloudReady()) return;
  const ms = Math.max(5, Number(SETTINGS.cloud.interval) || 15) * 1000;
  autoTimer = setInterval(() => {
    if(document.hidden) return;
    pullCloud(true);
  }, ms);
}

function renderRecords(){

          <div><b>来接人：</b>${r.picker ? esc(r.picker) : '—'}${r.relation ? '（' + esc(r.relation) + '）' : ''}${r.phone ? ' · ' + esc(r.phone) : ''}</div>
          ${r.note ? `<div><b>备注：</b>${esc(r.note)}</div>` : ''}
          <div style="color:#94a3b8;font-size:12px;margin-top:3px">登记于 ${fmtDT(new Date(r.createdAt).toISOString().slice(0,16))}</div>
        </div>
        <div class="rec-actions">
          ${r.status !== '已返校' ? `<button data-act="return" data-id="${r.id}">✔ 标记已返校</button>` : ''}

        </div>

  }).join('');
}

/* ---------- 汇总统计 ---------- */
function getRangeInfo(type){
  const now = new Date();
  if(type === 'week'){
    const m = mondayOf(now);
    const from = new Date(m); from.setHours(0,0,0,0);
    const to = new Date(from.getTime() + 7 * 86400000 - 1);
    return { from, to, label: `本周（${fmtDate(from)} ~ ${fmtDate(to)}）` };
  }
  if(type === 'month'){
    const from = new Date(now.getFullYear(), now.getMonth(), 1);
    const to = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
    return { from, to, label: `${now.getFullYear()}年${now.getMonth() + 1}月` };
  }
  if(type === 'term'){
    if(SETTINGS.termStart && SETTINGS.termEnd){
      return {
        from: new Date(SETTINGS.termStart + 'T00:00:00'),
        to:   new Date(SETTINGS.termEnd + 'T23:59:59'),
        label: `本学期（${SETTINGS.termStart} ~ ${SETTINGS.termEnd}）`
      };
    }
    const from = new Date(now.getFullYear(), now.getMonth() - 5, 1);
    const to = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
    return { from, to, label: '本学期（未设置学期时间，默认近 6 个月）' };
  }
  return { from: null, to: null, label: '全部记录' };
}

function renderSummary(){
  let from, to, label;
  if(currentRange.type === 'custom'){
    from = currentRange.from ? new Date(currentRange.from + 'T00:00:00') : null;
    to   = currentRange.to   ? new Date(currentRange.to   + 'T23:59:59') : null;
    label = `自定义（${currentRange.from || '不限'} ~ ${currentRange.to || '不限'}）`;
  }else if(currentRange.type === 'all'){
    from = null; to = null; label = '全部记录';
  }else{
    const info = getRangeInfo(currentRange.type);
    from = info.from; to = info.to; label = info.label;
  }
  $('rangeLabel').textContent = label;

  const f0 = from ? from.getTime() : -Infinity;
  const f1 = to ? to.getTime() : Infinity;

  const list = DB.leaves.filter(r => {
    const t = new Date(r.start).getTime();
    return t >= f0 && t <= f1;
  });

  /* 卡片 */
  const ill = list.filter(r => r.type === '病假').length;
  const per = list.filter(r => r.type === '事假').length;
  const oth = list.length - ill - per;
  const stuSet = new Set(list.map(r => r.cls + '-' + r.sid));
  const minsArr = list.map(recMinutes).filter(v => v != null);
  const avgH = minsArr.length ? (minsArr.reduce((a,b)=>a+b,0) / minsArr.length / 60) : 0;
  const nowOut = DB.leaves.filter(r => r.status === '离校中').length;

  $('statCards').innerHTML = `
    <div class="stat blue"><div class="k">请假总人次</div><div class="v">${list.length}<small>次</small></div></div>
    <div class="stat red"><div class="k">病假</div><div class="v">${ill}<small>次</small></div></div>
    <div class="stat amber"><div class="k">事假</div><div class="v">${per}<small>次</small></div></div>
    <div class="stat"><div class="k">其他</div><div class="v">${oth}<small>次</small></div></div>
    <div class="stat green"><div class="k">涉及学生</div><div class="v">${stuSet.size}<small>人</small></div></div>
    <div class="stat"><div class="k">平均时长</div><div class="v">${avgH.toFixed(1)}<small>小时</small></div></div>
    <div class="stat amber"><div class="k">当前离校中</div><div class="v">${nowOut}<small>人</small></div></div>
  `;

  /* 学生明细 */
  const map = new Map();
  list.forEach(r => {
    const key = r.cls + '-' + r.sid;
    if(!map.has(key)) map.set(key, {
      name: r.name, cls: r.cls, sid: r.sid, count: 0, ill: 0, per: 0, oth: 0, mins: 0
    });
    const o = map.get(key);
    o.count++;
    if(r.type === '病假') o.ill++;
    else if(r.type === '事假') o.per++;
    else o.oth++;
    const m = recMinutes(r);
    if(m != null) o.mins += m;
  });
  const rows = [...map.values()].sort((a, b) => b.count - a.count || a.sid.localeCompare(b.sid));

  let tCount = 0, tIll = 0, tPer = 0, tOth = 0, tMin = 0;
  rows.forEach(o => { tCount += o.count; tIll += o.ill; tPer += o.per; tOth += o.oth; tMin += o.mins; });

  $('tblStudents').innerHTML = `
    <thead><tr>
      <th>姓名</th><th>学号</th><th class="num">总次数</th>
      <th class="num">病假</th><th class="num">事假</th><th class="num">其他</th>
      <th class="num">累计时长</th>
    </tr></thead>
    <tbody>
      ${rows.length ? rows.map(o => `
        <tr>
          <td><b>${esc(o.name)}</b></td>
          <td>${esc(o.cls)}班 ${esc(o.sid)}号</td>
          <td class="num">${o.count}</td>
          <td class="num">${o.ill}</td>
          <td class="num">${o.per}</td>
          <td class="num">${o.oth}</td>
          <td class="num">${durationText(o.mins)}</td>
        </tr>`).join('') : '<tr><td colspan="7" style="text-align:center;color:#94a3b8;padding:24px">该时间段暂无请假记录</td></tr>'}
    </tbody>
    ${rows.length ? `<tfoot><tr>
      <td colspan="2">合计</td>
      <td class="num">${tCount}</td><td class="num">${tIll}</td>
      <td class="num">${tPer}</td><td class="num">${tOth}</td>
      <td class="num">${durationText(tMin)}</td>
    </tr></tfoot>` : ''}
  `;

  /* 按周汇总 */
  const wk = new Map();
  list.forEach(r => {
    const d = new Date(r.start);
    const { year, week } = isoWeek(d);
    const key = `${year}-W${pad(week)}`;
    if(!wk.has(key)){
      const mon = mondayOf(d);
      const sun = new Date(mon.getTime() + 6 * 86400000);
      wk.set(key, { key, mon, sun, count: 0, ill: 0, per: 0, oth: 0 });
    }
    const o = wk.get(key);
    o.count++;
    if(r.type === '病假') o.ill++;
    else if(r.type === '事假') o.per++;
    else o.oth++;
  });
  const wkArr = [...wk.values()].sort((a, b) => a.key.localeCompare(b.key));

  $('tblWeeks').innerHTML = `
    <thead><tr>
      <th>周次</th><th>日期范围</th>
      <th class="num">人次</th><th class="num">病假</th>
      <th class="num">事假</th><th class="num">其他</th>
    </tr></thead>
    <tbody>
      ${wkArr.length ? wkArr.map(o => `
        <tr>
          <td><b>${o.key}</b></td>
          <td>${fmtDate(o.mon)} ~ ${fmtDate(o.sun)}</td>
          <td class="num">${o.count}</td>
          <td class="num">${o.ill}</td>
          <td class="num">${o.per}</td>
          <td class="num">${o.oth}</td>
        </tr>`).join('') : '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:24px">暂无数据</td></tr>'}
    </tbody>
  `;

  /* 按月汇总 */
  const mo = new Map();
  list.forEach(r => {
    const d = new Date(r.start);
    const key = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    if(!mo.has(key)) mo.set(key, { key, count: 0, ill: 0, per: 0, oth: 0 });
    const o = mo.get(key);
    o.count++;
    if(r.type === '病假') o.ill++;
    else if(r.type === '事假') o.per++;
    else o.oth++;
  });
  const moArr = [...mo.values()].sort((a, b) => a.key.localeCompare(b.key));

  $('tblMonths').innerHTML = `
    <thead><tr>
      <th>月份</th><th class="num">人次</th><th class="num">病假</th>
      <th class="num">事假</th><th class="num">其他</th>
    </tr></thead>
    <tbody>
      ${moArr.length ? moArr.map(o => `
        <tr>
          <td><b>${o.key.replace('-', ' 年 ')} 月</b></td>
          <td class="num">${o.count}</td>
          <td class="num">${o.ill}</td>
          <td class="num">${o.per}</td>
          <td class="num">${o.oth}</td>
        </tr>`).join('') : '<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:24px">暂无数据</td></tr>'}
    </tbody>
  `;
}

  const stu = findStudent($('fStudent').value);
  if(!stu) return msg('请先选择有效的学生', false);
  const reason = $('fReason').value.trim();
  if(!reason) return msg('请填写请假事由', false);
  const start = $('fStart').value;
  if(!start) return msg('请选择请假开始时间', false);
  const end = $('fEnd').value;
  if(end && new Date(end) < new Date(start)) return msg('预计返校时间不能早于开始时间', false);

  const payload = {
    cls: stu.cls, sid: stu.sid, name: stu.name, gender: stu.gender,
    type: currentType,
    reason,
    start,
    end: end || '',
    picker: $('fPicker').value.trim(),
    relation: $('fRelation').value,
    phone: $('fPhone').value.trim(),
    status: $('fStatus').value,
    note: $('fNote').value.trim(),
    updatedAt: Date.now()
  };

  if(editingId){
    const idx = DB.leaves.findIndex(r => r.id === editingId);
    if(idx > -1){
      DB.leaves[idx] = Object.assign({}, DB.leaves[idx], payload);
    }
    msg('✅ 修改已保存', true);
    exitEditMode();
  }else{
    DB.leaves.push(Object.assign({ id: uid(), createdAt: Date.now() }, payload));
    msg('✅ 登记成功', true);
  }

  saveDB(true);
  resetForm(false);
  renderAll();
});

function resetForm(keepStudent){
  const nameVal = keepStudent ? $('fStudent').value : '';
  $('fReason').value = '';
  $('fStart').value = toLocalInput(new Date());
  $('fEnd').value = '';
  $('fPicker').value = '';
  $('fRelation').value = '';
  $('fPhone').value = '';
  $('fNote').value = '';
  $('fStatus').value = '离校中';
  if(!keepStudent){
    $('fStudent').value = '';
    $('studentHint').textContent = '未选择学生';
    $('studentHint').className = 'hint';
  }
}
function exitEditMode(){
  editingId = null;
  $('formTitle').textContent = '新增请假登记';
  $('btnSubmit').textContent = '提交登记';
  $('btnReset').textContent = '清空表单';
  resetForm(false);
}
$('btnReset').addEventListener('click', () => {
  if(editingId) exitEditMode();
  else resetForm(false);
  $('formMsg').textContent = '';
});

/* 记录操作（事件委托） */
$('recordsList').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if(!btn) return;
  const id = btn.dataset.id;
  const rec = DB.leaves.find(r => r.id === id);
  if(!rec) return;

  if(btn.dataset.act === 'del'){
    if(confirm(`确定删除【${rec.name}】的这条请假记录吗？`)){
      DB.leaves = DB.leaves.filter(r => r.id !== id);
      saveDB(true);
      renderAll();
      toast('已删除');
    }
  }
  else if(btn.dataset.act === 'return'){
    rec.status = '已返校';
    if(!rec.end) rec.end = toLocalInput(new Date());
    rec.updatedAt = Date.now();
    saveDB(true);
    renderAll();
    toast(`${rec.name} 已标记为返校`);
  }
  else if(btn.dataset.act === 'edit'){
    editingId = id;
    $('formTitle').textContent = `编辑请假记录 —— ${rec.name}`;
    $('btnSubmit').textContent = '保存修改';
    $('btnReset').textContent = '取消编辑';

    $('fStudent').value = rec.name;
    $('studentHint').textContent = `已选择：${rec.name}（${rec.cls}班 ${rec.sid}号 · ${rec.gender}）`;
    $('studentHint').className = 'hint ok';
    currentType = rec.type;
    document.querySelectorAll('#typeSeg .seg-btn').forEach(x =>
      x.classList.toggle('active', x.dataset.val === rec.type));
    $('fReason').value = rec.reason || '';
    $('fStart').value = rec.start || '';
    $('fEnd').value = rec.end || '';
    $('fPicker').value = rec.picker || '';
    $('fRelation').value = rec.relation || '';
    $('fPhone').value = rec.phone || '';
    $('fStatus').value = rec.status || '离校中';
    $('fNote').value = rec.note || '';

    document.querySelector('.tab[data-tab="form"]').click();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

/* 记录筛选 */
['qSearch','qStatus','qType','qFrom','qTo'].forEach(id => {
  $(id).addEventListener('input', renderRecords);
  $(id).addEventListener('change', renderRecords);
});

/* 导出 CSV */
$('btnExportCsv').addEventListener('click', () => {
  const rows = [['班级','学号','姓名','性别','类型','事由','开始时间','预计返校','时长','来接人','关系','电话','状态','备注']];
  const list = [...DB.leaves].sort((a, b) => new Date(b.start) - new Date(a.start));
  list.forEach(r => {
    rows.push([
      r.cls, r.sid, r.name, r.gender, r.type, r.reason,
      fmtDT(r.start), r.end ? fmtDT(r.end) : '',
      durationText(recMinutes(r)), r.picker || '', r.relation || '',
      r.phone || '', r.status, r.note || ''
    ]);
  });
  const csv = '\ufeff' + rows.map(row =>
    row.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')
  ).join('\r\n');
  download(csv, `请假记录_${fmtDate(new Date())}.csv`, 'text/csv;charset=utf-8');
  toast('CSV 已导出');
});

function download(content, filename, type){
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* 汇总区间切换 */
document.querySelectorAll('.range-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRange = { type: btn.dataset.range };
    $('rFrom').value = ''; $('rTo').value = '';
    renderSummary();
  });
});
['rFrom','rTo'].forEach(id => {
  $(id).addEventListener('change', () => {
    if(!$('rFrom').value && !$('rTo').value) return;
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
    currentRange = { type: 'custom', from: $('rFrom').value, to: $('rTo').value };
    renderSummary();
  });
});

/* 设置项 */
$('setClassName').addEventListener('change', () => {
  SETTINGS.className = $('setClassName').value.trim() || '03班';
  saveSettings(); renderBrand();
});
$('setTermStart').addEventListener('change', () => {
  SETTINGS.termStart = $('setTermStart').value; saveSettings(); renderSummary();
});
$('setTermEnd').addEventListener('change', () => {
  SETTINGS.termEnd = $('setTermEnd').value; saveSettings(); renderSummary();
});
$('setBinId').addEventListener('change', () => {
  SETTINGS.cloud.binId = $('setBinId').value.trim(); saveSettings(); updateSyncText(); startAutoSync();
});
$('setKey').addEventListener('change', () => {
  SETTINGS.cloud.key = $('setKey').value.trim(); saveSettings(); updateSyncText(); startAutoSync();
});
$('setInterval').addEventListener('change', () => {
  SETTINGS.cloud.interval = Math.max(5, Number($('setInterval').value) || 15);
  $('setInterval').value = SETTINGS.cloud.interval;
  saveSettings(); startAutoSync();
});
$('setAuto').addEventListener('change', () => {
  SETTINGS.cloud.auto = $('setAuto').checked;
  saveSettings();
  startAutoSync();
  if(SETTINGS.cloud.auto){
    if(!cloudReady()) setCloudMsg('⚠️ 请先填写 Bin ID 与 Master Key 才能自动同步', 'err');
    else { setCloudMsg('自动同步已开启', 'ok'); pullCloud(true); }
  }else{
    setCloudMsg('自动同步已关闭');
  }
});

$('btnPushCloud').addEventListener('click', () => pushCloud(false));
$('btnPullCloud').addEventListener('click', () => pullCloud(false));

/* 数据管理 */
$('btnExportJson').addEventListener('click', () => {
  const data = JSON.stringify({ students: DB.students, leaves: DB.leaves, exportedAt: new Date().toISOString() }, null, 2);
  download(data, `请假数据备份_${fmtDate(new Date())}.json`, 'application/json');
  toast('备份已导出');
});
$('btnImportJson').addEventListener('click', () => $('fileImport').click());
$('fileImport').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!Array.isArray(data.leaves)) throw new Error('文件格式不正确');
      DB = mergeDB(DB, data);
      saveDB(true);
      renderAll();
      toast('导入成功，数据已合并');
    }catch(err){
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
});
$('btnClearLeaves').addEventListener('click', () => {
  if(!DB.leaves.length) return toast('当前没有请假记录');
  if(confirm(`确定清空全部 ${DB.leaves.length} 条请假记录吗？此操作不可撤销！`)){
    DB.leaves = [];
    saveDB(true);
    renderAll();
    toast('已清空全部请假记录');
  }
});

/* =========================================================
 *  8. 启动
 * =======================================================*/
(function init(){
  SETTINGS = loadSettings();
  DB = loadDB();
  renderAll();
  resetForm(false);
  $('fStart').value = toLocalInput(new Date());
  startAutoSync();
  if(cloudReady() && SETTINGS.cloud.auto) pullCloud(true);

  console.log('%c学生请假管理系统已启动', 'color:#2563eb;font-weight:bold;font-size:14px');
})();
</script>
